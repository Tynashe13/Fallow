<!doctype html>
<!-- Fallow demo video: all scenes on one deterministic timeline. window.seek(seconds) draws any frame.
     Every screen is a real screenshot of the running app (see capture*.mjs); captions, highlight rings
     and the closing card are drawn by this file. No audio, no AI-generated imagery. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fallow demo scenes</title>
<style>
@font-face { font-family: "Figtree Variable"; font-weight: 300 900; font-display: block;
  src: url("../../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "DejaVu Mono"; font-weight: 400; font-display: block;
  src: url("../../node_modules/@fontsource/dejavu-mono/files/dejavu-mono-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "DejaVu Mono"; font-weight: 700; font-display: block;
  src: url("../../node_modules/@fontsource/dejavu-mono/files/dejavu-mono-latin-700-normal.woff2") format("woff2"); }
:root { --paper:#f4f4f1; --paper-2:#ebebe5; --white:#fffffe; --ink:#16150f; --soft:#5b5a52; --rule:#e6e5de;
  --green:#3f5a2a; --green-mid:#6f8f45; --green-pale:#c2ceae; --sun:#d9a441;
  --sans:"Figtree Variable",system-ui,sans-serif; --mono:"DejaVu Mono",monospace; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: var(--sans); color: var(--ink); }
.scene { position: absolute; inset: 0; overflow: hidden; background: var(--paper); opacity: 0; }
.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.layer img { position: absolute; display: block; }
.shot { left: 0; top: 0; width: 1920px; height: 1080px; }
#ledgerLayer { width: 2251px; height: 918px; background: var(--white); outline: 1px solid var(--rule); box-shadow: 0 10px 40px rgba(22,21,15,.10); }
.ring { position: absolute; border: 5px solid var(--sun); border-radius: 12px; box-shadow: 0 0 0 5px rgba(22,21,15,.16), 0 0 28px rgba(217,164,65,.5); opacity: 0; }
#caption { position: absolute; left: 60px; right: 60px; bottom: 44px; min-height: 150px; padding: 28px 48px 30px; border-radius: 16px;
  background: var(--ink); color: var(--paper); display: flex; flex-direction: column; justify-content: center; gap: 10px;
  box-shadow: 0 12px 40px rgba(22,21,15,.28); opacity: 0; border-left: 14px solid var(--green-mid); }
#caption .main { font-weight: 650; font-size: 58px; line-height: 1.12; letter-spacing: -0.012em; }
#caption .sub { font-family: var(--mono); font-size: 37px; line-height: 1.25; color: var(--green-pale); }
#caption .sub b { color: var(--sun); font-weight: 700; }
#closing { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; text-align: center; }
#closing .brand { display: flex; align-items: center; gap: 40px; }
#closing .brand svg { width: 170px; height: 170px; }
#closing .brand span { font-weight: 700; font-size: 200px; letter-spacing: -0.03em; line-height: 1; }
#closing .rule { width: 520px; height: 3px; background: var(--ink); }
#closing .line { font-size: 54px; font-weight: 500; line-height: 1.3; max-width: 1500px; }
#closing .tag { font-family: var(--mono); font-size: 30px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s-landing"><div class="layer"><img class="shot" src="shots/landing.png" alt=""></div></div>
  <div class="scene" id="s-overberg"><div class="layer"><img class="shot" src="shots/overberg.png" alt=""></div></div>
  <div class="scene" id="s-swartland"><div class="layer"><img class="shot" src="shots/swartland.png" alt=""></div></div>
  <div class="scene" id="s-ledger"><div class="layer" id="ledgerLayer">
    <img src="shots/ledger-rows-left.png" style="left:0;top:0;width:1502px;height:918px" alt="">
    <img src="shots/ledger-rows-right.png" style="left:749px;top:0;width:1502px;height:918px" alt="">
  </div></div>
  <div class="scene" id="s-analysis"><div class="layer"><img class="shot" src="shots/swartland-analysis.png" alt=""></div></div>
  <div class="scene" id="closing">
    <div class="brand">
      <!-- the app's own logo mark, copied from the running page (components/plate/glyphs.tsx) -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 11V0.6A11.4 11.4 0 0 0 0.6 11Z" fill="#6f8f45"></path><path d="M13 11h10.4A11.4 11.4 0 0 0 13 0.6Z" fill="#6f8f45"></path><path d="M11 13H0.6A11.4 11.4 0 0 0 11 23.4Z" fill="#3f5a2a"></path><path d="M13 13v10.4A11.4 11.4 0 0 0 23.4 13Z" fill="#6f8f45"></path><circle cx="17" cy="7.2" r="2.1" fill="#d9a441"></circle></svg>
      <span>Fallow</span>
    </div>
    <div class="rule"></div>
    <p class="line">Drawn by code from open data. AI-assisted.<br>Not affiliated with or endorsed by NASA.</p>
    <p class="tag">Model values, not measurements</p>
  </div>
  <div id="rings"></div>
  <div id="caption"><div class="main"></div><div class="sub"></div></div>
</div>
<script>
const DURATION = 28, FPS = 30, XF = 0.45; // seconds, frames per second, crossfade length
// cam keyframes: t (s), then the rectangle of the screen (in page px) that fills the frame: x, y, width
const SCENES = [
  { id: "s-landing", start: 0, cam: [[0, 300, 130, 1320], [0.3, 300, 130, 1320], [4.4, 345, 200, 1180]] },
  { id: "s-overberg", start: 4, cam: [[4, 0, 0, 1920], [4.9, 0, 0, 1920], [7.4, 330, 150, 1280], [8.3, 330, 150, 1280], [9.3, 20, 720, 800], [11.6, 30, 728, 780]],
    rings: [[440, 890, 102, 104, 9.5, 11.2]] },
  { id: "s-swartland", start: 11.2, cam: [[11.2, 30, 728, 780], [15.9, 30, 728, 780]],
    rings: [[78, 932, 362, 104, 12.0, 13.4], [440, 890, 102, 104, 13.2, 15.5]] },
  { id: "s-ledger", start: 15.5, cam: [[15.5, -24, 395, 1000], [16.6, -20, 400, 990], [17.6, 1085, -40, 1040], [19.9, 1100, -36, 1010]],
    rings: [[204, 448, 70, 350, 15.9, 16.7], [1207, 1, 78, 30, 17.7, 19.5], [1466, 1, 126, 144, 17.9, 19.5]] },
  { id: "s-analysis", start: 19.5, cam: [[19.5, 0, 0, 1920], [20.2, 0, 0, 1920], [21.2, 1150, 95, 770], [24.4, 1162, 99, 755]],
    rings: [[1497, 204, 332, 43, 21.3, 24], [1497, 337, 78, 31, 22.1, 24]] },
  { id: "closing", start: 24 },
];
const CAPTIONS = [
  [0.4, 4.0, "Wheat on wheat again?<br>Or a lupin or canola break crop?", ""],
  [4.2, 8.4, "The plate: one block of farmland,<br>drawn from NASA and open data.", ""],
  [8.6, 11.1, "Overberg: four rain sources agree within about 11%.", "<b>394 to 444 mm</b> a year"],
  [11.3, 15.4, "Swartland: the same four sources disagree.", "<b>325 to 507 mm</b> a year · spread <b>182 mm</b> · <b>48.3%</b> of IMERG"],
  [15.6, 19.4, "Every number links to a ledger row, with its source and its status.", ""],
  [19.6, 23.9, "The honest result: no winner can be named.", "<b>0 of 8</b> metric cells have a sourced value · model values, not measurements"],
];
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const out = (p) => 1 - Math.pow(1 - p, 3);
function camAt(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i], p = ease((t - a[0]) / (b[0] - a[0]));
      return [1, 2, 3].map((k) => a[k] + (b[k] - a[k]) * p);
    }
  }
  return keys[keys.length - 1].slice(1);
}
const ringHost = document.getElementById("rings");
SCENES.forEach((s) => { s.el = document.getElementById(s.id); s.layer = s.el.querySelector(".layer");
  s.ringEls = (s.rings || []).map(() => { const d = document.createElement("div"); d.className = "ring"; ringHost.appendChild(d); return d; }); });
const cap = document.getElementById("caption"), capMain = cap.querySelector(".main"), capSub = cap.querySelector(".sub");
window.seek = function (t) {
  SCENES.forEach((s, i) => {
    const next = SCENES[i + 1];
    const visible = t >= s.start && (!next || t < next.start + XF);
    s.el.style.opacity = visible ? (i === 0 ? 1 : ease(clamp((t - s.start) / XF))) : 0;
    s.el.style.zIndex = i;
    if (!s.cam) return;
    const [x, y, w] = camAt(s.cam, t), k = 1920 / w;
    s.layer.style.transform = `translate(${-x * k}px, ${-y * k}px) scale(${k})`;
    s.ringEls.forEach((el, j) => {
      const [rx, ry, rw, rh, t0, t1] = s.rings[j], pad = 8;
      const o = Math.min(clamp((t - t0) / 0.3), clamp((t1 - t) / 0.25));
      const grow = (1 - out(clamp((t - t0) / 0.45))) * 18;
      el.style.opacity = o;
      el.style.left = (rx - x) * k - pad - grow + "px"; el.style.top = (ry - y) * k - pad - grow + "px";
      el.style.width = rw * k + 2 * (pad + grow) + "px"; el.style.height = rh * k + 2 * (pad + grow) + "px";
    });
  });
  ringHost.style.cssText = "position:absolute;inset:0;z-index:50";
  const c = CAPTIONS.find((c) => t >= c[0] && t < c[1]);
  cap.style.zIndex = 60;
  if (!c) { cap.style.opacity = 0; return; }
  if (cap.dataset.k !== String(c[0])) { cap.dataset.k = c[0]; capMain.innerHTML = c[2]; capSub.innerHTML = c[3]; capSub.style.display = c[3] ? "" : "none"; }
  const pin = clamp((t - c[0]) / 0.35), pout = clamp((c[1] - t) / 0.2);
  cap.style.opacity = Math.min(out(pin), pout);
  cap.style.transform = `translateY(${(1 - out(pin)) * 26}px)`;
};
window.META = { DURATION, FPS, CAPTIONS };
const q = new URLSearchParams(location.search).get("t");
document.fonts.ready.then(() => window.seek(q ? +q : 0));
</script>
</body>
</html>
